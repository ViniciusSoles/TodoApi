 // @ts-nocheck
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minhas Tarefas — ToDoApi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-dark text-white">

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-black px-4">
        <span class="navbar-brand fw-bold">📋 ToDoApi</span>
        <button id="btn-logout" class="btn btn-outline-danger btn-sm">Sair</button>
    </nav>

    <div class="container py-4">

        <!-- Resumo -->
        <div class="row mb-4">
            <div class="col-6">
                <div class="card bg-secondary text-center p-3">
                    <h5 class="mb-0" id="total-pendentes">0</h5>
                    <small>Pendentes</small>
                </div>
            </div>
            <div class="col-6">
                <div class="card bg-success text-center p-3">
                    <h5 class="mb-0" id="total-concluidos">0</h5>
                    <small>Concluídas</small>
                </div>
            </div>
        </div>

        <!-- Formulário -->
        <div class="card bg-secondary p-3 mb-4">
            <h6 class="mb-3">Nova Tarefa</h6>
            <form id="create-form">
                <div class="mb-2">
                    <input type="text" id="new-title" class="form-control"
                           placeholder="Título da tarefa" required maxlength="100">
                </div>
                <div class="mb-2">
                    <input type="text" id="new-description" class="form-control"
                           placeholder="Descrição (opcional)" maxlength="500">
                </div>
                <button type="submit" class="btn btn-primary w-100">
                    + Adicionar
                </button>
            </form>
        </div>

        <!-- Lista -->
        <div id="todo-list"></div>

        <!-- Empty state -->
        <div id="empty-state" class="text-center text-muted d-none py-5">
            <p>Nenhuma tarefa encontrada.</p>
        </div>

    </div>

    <script type="module">
        import { logout }                        from "../js/auth.js";
        import { getAll, create, complete, remove } from "../js/todos.js";

        // verifica autenticação
        if (!sessionStorage.getItem("accessToken"))
            window.location.href = "login.html";

        // logout
        document.getElementById("btn-logout")
            .addEventListener("click", logout);

        // renderiza a lista
        const renderTodos = (todos) => {
            const list       = document.getElementById("todo-list");
            const emptyState = document.getElementById("empty-state");

            const pendentes  = todos.filter(t => !t.isCompleted);
            const concluidos = todos.filter(t => t.isCompleted);

            document.getElementById("total-pendentes").textContent  = pendentes.length;
            document.getElementById("total-concluidos").textContent = concluidos.length;

            if (todos.length === 0) {
                list.innerHTML = "";
                emptyState.classList.remove("d-none");
                return;
            }

            emptyState.classList.add("d-none");

            list.innerHTML = todos.map(todo => `
                <div class="card bg-secondary mb-2 p-3">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <span class="badge ${todo.isCompleted ? "bg-success" : "bg-warning text-dark"} me-2">
                                ${todo.isCompleted ? "Concluída" : "Pendente"}
                            </span>
                            <strong class="${todo.isCompleted ? "text-decoration-line-through text-muted" : ""}">
                                ${todo.title}
                            </strong>
                            ${todo.description
                                ? `<p class="text-muted small mb-0 mt-1">${todo.description}</p>`
                                : ""}
                            <small class="text-muted d-block mt-1">
                                ${new Date(todo.createdAt).toLocaleDateString("pt-BR")}
                            </small>
                        </div>
                        <div class="d-flex gap-2">
                            ${!todo.isCompleted ? `
                                <button class="btn btn-success btn-sm"
                                    onclick="completeTodo(${todo.id})">✓</button>
                            ` : ""}
                            <button class="btn btn-danger btn-sm"
                                onclick="deleteTodo(${todo.id})">✕</button>
                        </div>
                    </div>
                </div>
            `).join("");
        };

        // carrega os todos
        const loadTodos = async () => {
            const todos = await getAll();
            if (todos) renderTodos(todos);
        };

        // cria todo
        document.getElementById("create-form")
            .addEventListener("submit", async (e) => {
                e.preventDefault();

                const title       = document.getElementById("new-title").value;
                const description = document.getElementById("new-description").value;

                await create(title, description || null);

                document.getElementById("new-title").value       = "";
                document.getElementById("new-description").value = "";

                await loadTodos();
            });

        // completa todo — global pra funcionar no onclick
        window.completeTodo = async (id) => {
            await complete(id);
            await loadTodos();
        };

        // deleta todo — global pra funcionar no onclick
        window.deleteTodo = async (id) => {
            await remove(id);
            await loadTodos();
        };

        // carrega ao iniciar
        loadTodos();
    </script>

</body>
</html>
