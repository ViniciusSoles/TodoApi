<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro — ToDoApi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-dark d-flex align-items-center justify-content-center min-vh-100">

    <div class="card bg-secondary p-4 shadow" style="width: 100%; max-width: 400px;">
        <h4 class="text-white text-center mb-4">Cadastro</h4>

        <div id="error-message" class="alert alert-danger d-none"></div>
        <div id="success-message" class="alert alert-success d-none"></div>

        <form id="register-form">
            <div class="mb-3">
                <label class="form-label text-white">Nome</label>
                <input type="text" id="name" class="form-control" placeholder="Seu nome" required>
            </div>

            <div class="mb-3">
                <label class="form-label text-white">Email</label>
                <input type="email" id="email" class="form-control" placeholder="seu@email.com" required>
            </div>

            <div class="mb-3">
                <label class="form-label text-white">Senha</label>
                <input type="password" id="password" class="form-control" placeholder="Mínimo 8 caracteres" required minlength="8">
            </div>

            <button type="submit" id="btn-register" class="btn btn-primary w-100">
                Cadastrar
            </button>
        </form>

        <p class="text-center text-white mt-3 mb-0">
            Já tem conta?
            <a href="login.html" class="text-primary">Entrar</a>
        </p>
    </div>

    <script type="module">
        import { register } from "../js/auth.js";

        const form        = document.getElementById("register-form");
        const errorDiv    = document.getElementById("error-message");
        const successDiv  = document.getElementById("success-message");
        const btnRegister = document.getElementById("btn-register");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            const name     = document.getElementById("name").value;
            const email    = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            btnRegister.disabled    = true;
            btnRegister.textContent = "Cadastrando...";
            errorDiv.classList.add("d-none");

            const success = await register(name, email, password);

            if (success) {
                successDiv.textContent = "Cadastro realizado! Redirecionando...";
                successDiv.classList.remove("d-none");
                setTimeout(() => window.location.href = "login.html", 1500);
            } else {
                errorDiv.textContent = "Erro ao cadastrar. Tente novamente.";
                errorDiv.classList.remove("d-none");
                btnRegister.disabled    = false;
                btnRegister.textContent = "Cadastrar";
            }
        });
    </script>

</body>
</html>
