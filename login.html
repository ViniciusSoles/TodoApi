<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — ToDoApi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-dark d-flex align-items-center justify-content-center min-vh-100">

    <div class="card bg-secondary p-4 shadow" style="width: 100%; max-width: 400px;">
        <h4 class="text-white text-center mb-4">Login</h4>

        <!-- erro -->
        <div id="error-message" class="alert alert-danger d-none"></div>

        <form id="login-form">
            <div class="mb-3">
                <label class="form-label text-white">Email</label>
                <input type="email" id="email" class="form-control" placeholder="seu@email.com" required>
            </div>

            <div class="mb-3">
                <label class="form-label text-white">Senha</label>
                <input type="password" id="password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" id="btn-login" class="btn btn-primary w-100">
                Entrar
            </button>
        </form>

        <p class="text-center text-white mt-3 mb-0">
            Não tem conta?
            <a href="register.html" class="text-primary">Cadastre-se</a>
        </p>
    </div>

    <script type="module">
        import { login } from "../js/auth.js";

        const form     = document.getElementById("login-form");
        const errorDiv = document.getElementById("error-message");
        const btnLogin = document.getElementById("btn-login");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            const email    = document.getElementById("email").value;
            const password = document.getElementById("password").value;



            btnLogin.disabled    = true;
            btnLogin.textContent = "Entrando...";
            errorDiv.classList.add("d-none");

            const success = await login(email, password);

            if (success) {
                window.location.href = "todos.html";
            } else {
                errorDiv.textContent = "Email ou senha inválidos.";
                errorDiv.classList.remove("d-none");
                btnLogin.disabled    = false;
                btnLogin.textContent = "Entrar";
            }
        });
    </script>

</body>
</html>
